name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Test, Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ha-timeline-card.js
          generate_release_notes: false
          body: |
            ## Installation

            ### HACS
            Mettez à jour via HACS.

            ### Manuel
            Télécharger `ha-timeline-card.js` et remplacer le fichier dans `<config>/www/`.
