name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Test, Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub releases

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        # Extracts version from the git tag (e.g. v0.3.0 → 0.3.0) and writes
        # it into package.json so the rollup banner reflects the correct version.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          npm version "$TAG_VERSION" --no-git-tag-version

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: ha-timeline-card.js
          generate_release_notes: false
          body: |
            ## Installation

            ### HACS
            Mettez à jour via HACS.

            ### Manuel
            Télécharger `ha-timeline-card.js` et remplacer le fichier dans `<config>/www/`.
